id = "veo-3.1"
label = "Veo 3.1"
category = "VID"
platform = "google"
endpoint = "veo-3.1-generate-preview"
description = "Google's latest video generation model. Text-to-video and image-to-video with cinematic quality, fluid motion, and enhanced prompt understanding. Supports frame interpolation with last_frame."

[pricing]
cost_per_second = 0.50
currency = "USD"

[general]
image_url_param = "image"
duration_type = "seconds"
duration_param_name = "duration_seconds"

[params.aspect_ratio]
label = "Aspect Ratio"
type = "select"
default = "16:9"
optional = true
options = [
  { value = "16:9", label = "16:9 · Landscape" },
  { value = "9:16", label = "9:16 · Portrait · Vertical" },
  { value = "1:1",  label = "1:1 · Square" },
]
note = "Ignored when image is provided"

[params.duration_seconds]
label = "Duration"
type = "select"
default = "5"
options = [
  { value = "4",  label = "4s · Short" },
  { value = "5",  label = "5s · Standard" },
  { value = "8",  label = "8s · Long" },
]

[params.enhance_prompt]
label = "Enhance Prompt"
type = "boolean"
default = true
description = "Let Google automatically enhance and expand the prompt for better results"

[params.number_of_videos]
label = "Number of Videos"
type = "integer"
default = 1
min = 1
max = 2
