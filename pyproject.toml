[project]
name = "engine-google"
version = "0.1.0"
description = "Engine wrapper for the Google AI API (google-genai SDK). Uniform interface that studiolot Generators call instead of importing the Google Generative AI SDK directly."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools]
packages = ["engine_google"]

[tool.setuptools.package-data]
engine_google = ["endpoints/**/*.toml", "endpoints/**/*.gitkeep"]
